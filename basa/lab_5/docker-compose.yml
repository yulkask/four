# Стенд лабораторной 5. Планировщик выключен специально:
# его включают командой SET GLOBAL в sql/03_demo.sql (пункт 1 задания).
name: lab_5

services:
  db:
    image: mysql:8.0
    container_name: lab5_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --event-scheduler=OFF
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kvartplata
    ports:
      - "3309:3306"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lab5_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8082:80"
    depends_on:
      - db
